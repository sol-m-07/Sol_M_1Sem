name: Build and Test

on:
  push:
    branches: [ main, master, hometask_1, hometask_2, hometask_3, hometask_4, hometask_5 ]
  pull_request:
    branches: [ main, master, hometask_1, hometask_2, hometask_3, hometask_4, hometask_5 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Docker is available (required for Testcontainers)
        run: docker version

      - name: Compile
        run: mvn -B clean compile

      - name: Run tests (unit + slice + Testcontainers integration)
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests
