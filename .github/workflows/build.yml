name: Build and Test

on:
  push:
    branches: [ main, master, hometask_1 ]
  pull_request:
    branches: [ main, master, hometask_1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean compile

      - name: Run tests
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests
